services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circuless-node
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./.env:/app/.env
      - ./certificate.pem:/app/certificate.pem
    depends_on:
      - postgres
    # networks:
    #   circ-adapter_adpnetwork:
    #     ipv4_address: 172.31.5.5
    networks:
      - testnetwork
    restart: unless-stopped
  
  postgres:
    image: postgres:17.6-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: bavenir
      POSTGRES_PASSWORD: bavenir
      POSTGRES_DB: circdb
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # networks:
    #   circ-adapter_adpnetwork:
    #     ipv4_address: 172.31.5.2
    networks:
      - testnetwork

    # Fluent Bit Log Collector
  fluent-bit:
    image: fluent/fluent-bit:4.2
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml
      - ./fluent-bit/parsers.yaml:/fluent-bit/etc/parsers.yaml
      - ./logs:/var/log/fastapi:ro
      - ./fluentbit-out:/fluent-bit/logs
    environment:
      - ENVIRONMENT=development
      - LOKI_HOST=loki
      - LOKI_PORT=3100
    command: /fluent-bit/bin/fluent-bit -c /fluent-bit/etc/fluent-bit.yaml
    restart: unless-stopped
    # networks:
    #   circ-adapter_adpnetwork:
    #     ipv4_address: 172.31.5.3
    networks:
      - testnetwork

  zipkin:
    image: openzipkin/zipkin-slim:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    # networks:
    #   circ-adapter_adpnetwork:
    #     ipv4_address: 172.31.5.10
    networks:
      - testnetwork

